name: Verify proposed Sprint 1 solutions
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/verification.md'
      - 'VERIFICATION.md'
      - 'FINAL_REPORT.md'
      - '.jarvis/**'
      - 'reports/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct pinned official baseline and verify all proposals
        run: sh scripts/verify-integrated.sh "$GITHUB_WORKSPACE/verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-verification
          path: |
            verification/*.log
            verification/*.xml
            verification/*races.json
            verification/result.json
            verification/health.json
          if-no-files-found: warn
  individual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ['12', '21', '23', '24', '37', '39', '43', '44']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify issue and its declared prerequisites from a fresh clone
        run: sh scripts/verify-issue.sh '${{ matrix.issue }}' "$GITHUB_WORKSPACE/verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-${{ matrix.issue }}-verification
          path: |
            verification/*.log
            verification/*.xml
            verification/*races.json
            verification/result.json
            verification/health.json
          if-no-files-found: warn
